<!-- @dsCard group="浮层" height=400 -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Tooltip</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;700;900&display=swap"></head>
<body class="hao-stage">
<div class="hao-bi">
<section lang="zh-CN">
<p class="hao-bi__tag">中文</p>
<div class="hao-row" style="gap:var(--space-5)"><span class="hao-tip" role="tooltip">导出为 PDF</span><span class="hao-tip" role="tooltip">上次同步在三分钟前，下拉可以立即同步</span></div>
<div class="hao-row" style="margin-top:var(--space-8)"><button class="hao-btn hao-btn--tinted" data-hao-tip="导出为 PDF"><i class="hao-icon hao-icon--download" aria-hidden="true"></i>导出</button><button class="hao-btn hao-btn--tinted" data-hao-tip="上次同步在三分钟前">同步</button></div>
</section>
<section lang="en">
<p class="hao-bi__tag">English</p>
<div class="hao-row" style="gap:var(--space-5)"><span class="hao-tip" role="tooltip">Export as PDF</span><span class="hao-tip" role="tooltip">Last synced 3 minutes ago. Pull down to sync now.</span></div>
<div class="hao-row" style="margin-top:var(--space-8)"><button class="hao-btn hao-btn--tinted" data-hao-tip="Export as PDF"><i class="hao-icon hao-icon--download" aria-hidden="true"></i>Export</button><button class="hao-btn hao-btn--tinted" data-hao-tip="Last synced 3 minutes ago">Sync</button></div>
</section>
</div>
</body>
</html>
