<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Radio</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;700;900&display=swap"></head>
<body class="hao-stage">
<div class="hao-bi">

<p class="hao-bi__tag">中文</p>
<fieldset class="hao-choices">
  <legend>外观</legend>
  <label class="hao-radio"><input type="radio" name="a" checked> 跟随系统</label>
  <label class="hao-radio"><input type="radio" name="a"> 昼</label>
  <label class="hao-radio"><input type="radio" name="a"> 夜</label>

<section lang="en">
<p class="hao-bi__tag">English</p>
<fieldset class="hao-choices">
  <legend>Appearance</legend>
  <label class="hao-radio"><input type="radio" name="a-en" checked> Match system</label>
  <label class="hao-radio"><input type="radio" name="a-en"> Day</label>
  <label class="hao-radio"><input type="radio" name="a-en"> Night</label>
</fieldset>
</section>
</div>
</body>
</html>
