<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>TabBar</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;700;900&display=swap"></head>
<body class="hao-stage">
<div class="hao-bi">
<section lang="zh-CN">
<p class="hao-bi__tag">中文</p>
<nav class="hao-tabbar" aria-label="主导航" style="max-width:390px;border-radius:var(--radius-md)">
  <a class="hao-tabbar__item" href="#" aria-current="page"><i class="hao-icon hao-icon--today" aria-hidden="true"></i>今日</a>
  <a class="hao-tabbar__item" href="#"><i class="hao-icon hao-icon--notes" aria-hidden="true"></i>札记</a>
  <a class="hao-tabbar__item" href="#"><i class="hao-icon hao-icon--person" aria-hidden="true"></i>我的</a>
</nav>
</section>
<section lang="en">
<p class="hao-bi__tag">English</p>
<nav class="hao-tabbar" aria-label="Main" style="max-width:390px;border-radius:var(--radius-md)">
  <a class="hao-tabbar__item" href="#" aria-current="page"><i class="hao-icon hao-icon--today" aria-hidden="true"></i>Today</a>
  <a class="hao-tabbar__item" href="#"><i class="hao-icon hao-icon--notes" aria-hidden="true"></i>Notes</a>
  <a class="hao-tabbar__item" href="#"><i class="hao-icon hao-icon--person" aria-hidden="true"></i>Me</a>
</nav>
</section>
</div>
</body>
</html>
