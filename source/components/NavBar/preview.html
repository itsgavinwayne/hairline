<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>NavBar</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;700;900&display=swap"></head>

    <div class="hao-nav__bar">

</div>
