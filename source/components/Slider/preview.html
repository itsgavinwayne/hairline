<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Slider</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;700;900&display=swap"></head>
<body class="hao-stage">
<div class="hao-bi">
<section lang="zh-CN">
<p class="hao-bi__tag">中文</p>
<div class="hao-field" style="width:320px;max-width:100%">
  <label class="hao-field__label" for="sl">正文字号</label>
  <input class="hao-slider" id="sl" type="range" min="14" max="22" value="17" style="--v:37.5%">
  <span class="hao-field__hint">17，标准</span>
</div>
</section>
<section lang="en">
<p class="hao-bi__tag">English</p>
<div class="hao-field" style="width:320px;max-width:100%">
  <label class="hao-field__label" for="sl-en">Body text size</label>
  <input class="hao-slider" id="sl-en" type="range" min="14" max="22" value="17" style="--v:37.5%">
  <span class="hao-field__hint">17, standard</span>
</div>
</section>
</div>
</body>
</html>
