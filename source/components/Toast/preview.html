<!-- @dsCard group="反馈" height=500 -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Toast</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;700;900&display=swap"></head>
<body class="hao-stage">
<div class="hao-bi">
<section lang="zh-CN">
<p class="hao-bi__tag">中文</p>
<div class="hao-stack" style="align-items:flex-start">
  <div class="hao-toast" role="status"><span class="hao-toast__ok" aria-hidden="true"></span>已保存</div>
  <div class="hao-toast" role="status">已删除「晨间札记」<button class="hao-toast__action">撤销</button></div>
</div>
<div class="hao-row" style="margin-top:var(--space-5)"><button class="hao-btn hao-btn--tinted" data-hao-toast="已保存" data-hao-toast-ok>保存</button><button class="hao-btn hao-btn--tinted" data-hao-toast="已删除「晨间札记」" data-hao-toast-action="撤销">删除</button></div>
</section>
<section lang="en">
<p class="hao-bi__tag">English</p>
<div class="hao-stack" style="align-items:flex-start">
  <div class="hao-toast" role="status"><span class="hao-toast__ok" aria-hidden="true"></span>Saved</div>
  <div class="hao-toast" role="status">Deleted “Morning note”<button class="hao-toast__action">Undo</button></div>
</div>
<div class="hao-row" style="margin-top:var(--space-5)"><button class="hao-btn hao-btn--tinted" data-hao-toast="Saved" data-hao-toast-ok>Save</button><button class="hao-btn hao-btn--tinted" data-hao-toast="Deleted “Morning note”" data-hao-toast-action="Undo">Delete</button></div>
</section>
</div>
</body>
</html>
