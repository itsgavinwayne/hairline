<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Tag</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;700;900&display=swap"></head>
<body class="hao-stage">
<div class="hao-bi">
<section lang="zh-CN">
<p class="hao-bi__tag">中文</p>
<div class="hao-row">
  <span class="hao-tag">草稿</span>
  <span class="hao-tag hao-tag--tint">进行中</span>
  <span class="hao-tag hao-tag--jade">已完成</span>
  <span class="hao-tag hao-tag--amber">今天到期</span>
  <span class="hao-tag hao-tag--seal">已逾期</span>
</div>
</section>
<section lang="en">
<p class="hao-bi__tag">English</p>
<div class="hao-row">
  <span class="hao-tag">Draft</span>
  <span class="hao-tag hao-tag--tint">In progress</span>
  <span class="hao-tag hao-tag--jade">Done</span>
  <span class="hao-tag hao-tag--amber">Due today</span>
  <span class="hao-tag hao-tag--seal">Overdue</span>
</div>
</section>
</div>

</html>
