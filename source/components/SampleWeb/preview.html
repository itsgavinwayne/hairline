<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>SampleWeb</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/28px var(--font-sans); -webkit-font-smoothing: antialiased; }
  .top { position: sticky; top: 0; z-index: var(--z-nav); background: var(--material); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-bottom: 1px solid var(--hairline); }
  .bar { display: flex; align-items: center; gap: var(--space-8); min-height: 56px; }
  .brand { display: inline-flex; align-items: center; gap: var(--space-2); font: 600 17px/24px var(--font-sans); color: var(--ink); text-decoration: none; }
  .brand:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: var(--radius-sm); }
  .hao-tabs.links { flex: 1; box-shadow: none; align-self: stretch; }
  .links .hao-tabs__item { min-height: 56px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-6); padding: var(--space-12) 0 var(--space-4); }
  .head h1 { margin: 0; font: 700 32px/40px var(--font-serif); letter-spacing: .02em; }
  .head p { margin: var(--space-1) 0 0; font: 400 15px/24px var(--font-sans); color: var(--ink-secondary); }
</style></head>
<body class="">
<header class="top"><div class="hao-page bar">
  <a class="brand" href="#"><span class="hao-seal hao-seal--sm" aria-hidden="true">印</span>产品名</a>
  <nav class="hao-tabs links" aria-label="主导航"><a class="hao-tabs__item" href="#" aria-current="page">札记</a><a class="hao-tabs__item" href="#">今日</a><a class="hao-tabs__item" href="#">文件夹</a></nav>
  <label class="hao-search" style="width:260px"><i class="hao-icon hao-icon--search" aria-hidden="true"></i><input type="search" placeholder="搜索札记" aria-label="搜索札记"></label>
</div></header>
<main class="hao-page" style="padding-bottom:var(--space-12)">
  <div class="head"><div><h1>札记</h1><p>共 38 条，本周新增 3 条</p></div><button class="hao-btn">写一条札记</button></div>
  <div class="hao-fret" role="presentation" style="width:120px;margin-bottom:var(--space-8)"></div>
  <div class="hao-grid">
    <section style="grid-column:span 8">
      <div class="hao-tabs" role="tablist" style="margin-bottom:var(--space-5)"><button class="hao-tabs__item" role="tab" aria-selected="true">全部</button><button class="hao-tabs__item" role="tab" aria-selected="false">随笔</button><button class="hao-tabs__item" role="tab" aria-selected="false">读书</button><button class="hao-tabs__item" role="tab" aria-selected="false">旅行</button></div>
      <div class="hao-table-wrap"><table class="hao-table">
        <thead><tr><th scope="col">标题</th><th scope="col">文件夹</th><th scope="col">状态</th><th scope="col" class="hao-num">字数</th><th scope="col">上次编辑</th></tr></thead>
        <tbody>
          <tr><td>晨间札记</td><td class="hao-muted">随笔</td><td><span class="hao-tag hao-tag--jade">已发布</span></td><td class="hao-num">486</td><td class="hao-muted">今天 07:12</td></tr>
          <tr><td>《园冶》读书笔记</td><td class="hao-muted">读书</td><td><span class="hao-tag hao-tag--tint">进行中</span></td><td class="hao-num">2,140</td><td class="hao-muted">昨天</td></tr>
          <tr><td>苏州三日</td><td class="hao-muted">旅行</td><td><span class="hao-tag">草稿</span></td><td class="hao-num">912</td><td class="hao-muted">11 月 12 日</td></tr>
          <tr><td>入冬的第一场雨</td><td class="hao-muted">随笔</td><td><span class="hao-tag hao-tag--jade">已发布</span></td><td class="hao-num">327</td><td class="hao-muted">11 月 9 日</td></tr>
          <tr><td>年度书单</td><td class="hao-muted">读书</td><td><span class="hao-tag hao-tag--amber">今天到期</span></td><td class="hao-num">1,058</td><td class="hao-muted">11 月 3 日</td></tr>
        </tbody></table></div>
    </section>
    <aside style="grid-column:span 4;display:flex;flex-direction:column;gap:var(--gutter)">
      <div class="hao-card"><h2 class="hao-card__title">本周</h2><p class="hao-card__body">写了 3 条，共 1,725 字。</p><div class="hao-progress" role="progressbar" aria-label="本周目标" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="margin-top:var(--space-4)"><span style="--v:60%"></span></div><p class="hao-card__meta" style="margin-top:var(--space-2)">周目标 5 条，已完成 3 条</p></div>
      <div><p class="hao-list-header">文件夹</p><ul class="hao-list">
        <li><a class="hao-list__row" href="#"><span class="hao-list__title">随笔</span><span class="hao-list__value">17</span></a></li>
        <li><a class="hao-list__row" href="#"><span class="hao-list__title">读书</span><span class="hao-list__value">12</span></a></li>
        <li><a class="hao-list__row" href="#"><span class="hao-list__title">旅行</span><span class="hao-list__value">9</span></a></li>
      </ul></div>
    </aside>
  </div>
</main>
</body>
</html>
