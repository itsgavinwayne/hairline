<!-- @dsCard group="状态" height=240 -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Badge</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;700;900&display=swap"></head>
<body class="hao-stage">
<div class="hao-bi">
<section lang="zh-CN">
<p class="hao-bi__tag">中文</p>
<div class="hao-row" style="gap:var(--space-6)">
  <span class="hao-badge" aria-label="3 条未读">3</span>
  <span class="hao-badge" aria-label="99 条以上未读">99+</span>
  <span class="hao-badge hao-badge--dot" role="img" aria-label="有新内容"></span>
  <span class="hao-badge hao-badge--quiet">12</span>
</div>
</section>
<section lang="en">
<p class="hao-bi__tag">English</p>
<div class="hao-row" style="gap:var(--space-6)">
  <span class="hao-badge" aria-label="3 unread">3</span>
  <span class="hao-badge" aria-label="More than 99 unread">99+</span>
  <span class="hao-badge hao-badge--dot" role="img" aria-label="New content"></span>
  <span class="hao-badge hao-badge--quiet">12</span>
</div>
</section>
</div>
</body>
</html>
