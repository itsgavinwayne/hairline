<!-- @dsCard group="反馈" height=960 -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Progress</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;700;900&display=swap"></head>
<body class="hao-stage">
<div class="hao-bi">
<section lang="zh-CN">
<p class="hao-bi__tag">中文</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),340px));gap:var(--space-8) var(--space-12);align-items:start">
  <div><div class="hao-row" style="gap:var(--space-4)"><span class="hao-moon hao-moon--lg" role="progressbar" aria-label="本月目标" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" style="--p:.62"></span><div><div style="font:600 24px/32px var(--font-serif)">六成二</div><div style="margin:var(--space-2) 0 0;font:400 13px/20px var(--font-sans);color:var(--ink-tertiary);margin:0">本月写了 31 条，目标 50 条</div></div></div>
    <div class="hao-row" style="gap:var(--space-4);margin-top:var(--space-5)"><span class="hao-moon" style="--p:.1"></span><span class="hao-moon" style="--p:.3"></span><span class="hao-moon" style="--p:.5"></span><span class="hao-moon" style="--p:.7"></span><span class="hao-moon" style="--p:.9"></span><span class="hao-moon hao-moon--done" style="--p:1"></span></div>
    <p style="margin:var(--space-2) 0 0;font:400 13px/20px var(--font-sans);color:var(--ink-tertiary)">月盈：从朔到望，满了转为竹青</p></div>
  <div style="display:flex;flex-direction:column;gap:var(--space-6)">
    <div><div class="hao-progress hao-progress--stitch" role="progressbar" aria-label="正在导出" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><span style="--v:62%"></span></div><p style="margin:var(--space-2) 0 0;font:400 13px/20px var(--font-sans);color:var(--ink-tertiary);margin-top:var(--space-3)">针线：正在导出，已完成 62%</p></div>
    <div><div class="hao-progress hao-progress--ke" role="progressbar" aria-label="存储空间" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"><span style="--v:40%"></span></div><p style="margin:var(--space-2) 0 0;font:400 13px/20px var(--font-sans);color:var(--ink-tertiary);margin-top:var(--space-5)">刻度：已用 4 GB，共 10 GB</p></div>
    <div><div class="hao-progress" role="progressbar" aria-label="正在上传" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"><span style="--v:80%"></span></div><p style="margin:var(--space-2) 0 0;font:400 13px/20px var(--font-sans);color:var(--ink-tertiary)">素线：正在上传</p></div>
  </div>
  <div class="hao-row" style="gap:var(--space-6)"><span class="hao-row"><span class="hao-spinner" role="status" aria-label="正在同步"></span><span style="font-size:15px;color:var(--ink-secondary)">正在同步</span></span><span class="hao-row"><span class="hao-ripple" role="status" aria-label="正在载入"><i></i></span><span style="font-size:15px;color:var(--ink-secondary)">正在载入</span></span><span class="hao-spinner hao-spinner--ring" role="status" aria-label="载入中"></span></div>
  <div style="display:flex;flex-direction:column;gap:var(--space-2)" aria-hidden="true"><span class="hao-skeleton" style="width:45%;height:22px"></span><span class="hao-skeleton"></span><span class="hao-skeleton" style="width:80%"></span><span class="hao-skeleton hao-skeleton--lines" style="margin-top:var(--space-3)"></span></div>
</div>
</section>
<section lang="en">
<p class="hao-bi__tag">English</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),340px));gap:var(--space-8) var(--space-12);align-items:start">
  <div><div class="hao-row" style="gap:var(--space-4)"><span class="hao-moon hao-moon--lg" role="progressbar" aria-label="Monthly goal" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" style="--p:.62"></span><div><div style="font:600 24px/32px var(--font-serif)">62%</div><div style="margin:var(--space-2) 0 0;font:400 13px/20px var(--font-sans);color:var(--ink-tertiary);margin:0">31 notes this month, goal 50</div></div></div>
    <div class="hao-row" style="gap:var(--space-4);margin-top:var(--space-5)"><span class="hao-moon" style="--p:.1"></span><span class="hao-moon" style="--p:.3"></span><span class="hao-moon" style="--p:.5"></span><span class="hao-moon" style="--p:.7"></span><span class="hao-moon" style="--p:.9"></span><span class="hao-moon hao-moon--done" style="--p:1"></span></div>
    <p style="margin:var(--space-2) 0 0;font:400 13px/20px var(--font-sans);color:var(--ink-tertiary)">Waxing moon: new to full, turning jade when complete</p></div>
  <div style="display:flex;flex-direction:column;gap:var(--space-6)">
    <div><div class="hao-progress hao-progress--stitch" role="progressbar" aria-label="Exporting" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><span style="--v:62%"></span></div><p style="margin:var(--space-2) 0 0;font:400 13px/20px var(--font-sans);color:var(--ink-tertiary);margin-top:var(--space-3)">Thread: exporting, 62% done</p></div>
    <div><div class="hao-progress hao-progress--ke" role="progressbar" aria-label="Storage" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"><span style="--v:40%"></span></div><p style="margin:var(--space-2) 0 0;font:400 13px/20px var(--font-sans);color:var(--ink-tertiary);margin-top:var(--space-5)">Ticks: 4 GB of 10 GB used</p></div>
    <div><div class="hao-progress" role="progressbar" aria-label="Uploading" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"><span style="--v:80%"></span></div><p style="margin:var(--space-2) 0 0;font:400 13px/20px var(--font-sans);color:var(--ink-tertiary)">Plain: uploading</p></div>
  </div>
  <div class="hao-row" style="gap:var(--space-6)"><span class="hao-row"><span class="hao-spinner" role="status" aria-label="Syncing"></span><span style="font-size:15px;color:var(--ink-secondary)">Syncing</span></span><span class="hao-row"><span class="hao-ripple" role="status" aria-label="Loading"><i></i></span><span style="font-size:15px;color:var(--ink-secondary)">Loading</span></span><span class="hao-spinner hao-spinner--ring" role="status" aria-label="Loading"></span></div>
  <div style="display:flex;flex-direction:column;gap:var(--space-2)" aria-hidden="true"><span class="hao-skeleton" style="width:45%;height:22px"></span><span class="hao-skeleton"></span><span class="hao-skeleton" style="width:80%"></span><span class="hao-skeleton hao-skeleton--lines" style="margin-top:var(--space-3)"></span></div>
</div>
</section>
</div>
</body>
</html>
