<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Stepper</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;700;900&display=swap"></head>
<body class="hao-stage">
<div class="hao-bi">
<section lang="zh-CN">
<p class="hao-bi__tag">中文</p>
<div class="hao-row" style="gap:var(--space-4)"><span style="font-size:17px">每周目标</span>
<span class="hao-stepper" data-min="1" data-max="20" role="group" aria-label="每周目标"><button aria-label="减少"><i class="hao-icon hao-icon--minus" aria-hidden="true"></i></button><output>5</output><button aria-label="增加"><i class="hao-icon hao-icon--plus" aria-hidden="true"></i></button></span><span style="font-size:15px;color:var(--ink-secondary)">条</span></div>
</section>
<section lang="en">
<p class="hao-bi__tag">English</p>
<div class="hao-row" style="gap:var(--space-4)"><span style="font-size:17px">Weekly goal</span>
<span class="hao-stepper" data-min="1" data-max="20" role="group" aria-label="Weekly goal"><button aria-label="Decrease"><i class="hao-icon hao-icon--minus" aria-hidden="true"></i></button><output>5</output><button aria-label="Increase"><i class="hao-icon hao-icon--plus" aria-hidden="true"></i></button></span><span style="font-size:15px;color:var(--ink-secondary)">notes</span></div>
</section>
</div>
</body>
</html>
