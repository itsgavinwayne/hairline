<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字号对比 · 一栏</title>
<!--
  tests/type-scale.html 里每一栏装的就是这一页。参数：
    scale=now|rec|alt   现在（now.css 快照）、推荐（dist/hairline.css）、备选（now.css + alt.css）
    sample=screen|article|form|data|cover
    lang=zh|en   theme=light|dark
  内容全部用系统自己的组件和字体样式类，这一页不写任何字号。
-->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var scale = q.get('scale') || 'rec';
  window.__q = { scale: scale, sample: q.get('sample') || 'screen', lang: q.get('lang') || 'zh', theme: q.get('theme') || 'light' };
  document.documentElement.dataset.theme = window.__q.theme;
  document.documentElement.lang = window.__q.lang === 'en' ? 'en' : 'zh-CN';
  var css = scale === 'rec' ? ['../../dist/hairline.css'] : scale === 'alt' ? ['now.css', 'alt.css'] : ['now.css'];
  css.forEach(function (href) { document.write('<link rel="stylesheet" href="' + href + '">'); });
})();
</script>
<style>
  html, body { margin: 0; }
  body { background: var(--hao-bg); color: var(--hao-ink); -webkit-font-smoothing: antialiased; }
  .x { box-sizing: border-box; padding: var(--hao-space-6) var(--hao-space-4); display: flex; flex-direction: column; gap: var(--hao-space-6); }
  .x > * { flex: none; }
  .x--paper { padding: 0; background: var(--hao-surface); }
  .x-top { display: flex; align-items: flex-end; justify-content: space-between; }
  .x-top p, .x-top h1, .x-head h1, .x-head p { margin: 0; }
  .x-date { color: var(--hao-ink-tertiary); margin-bottom: var(--hao-space-1); }
  .x-head p { margin-top: var(--hao-space-1); color: var(--hao-ink-secondary); }
  .x-stats { display: flex; flex-wrap: wrap; gap: var(--hao-space-5) var(--hao-space-8); align-items: flex-start; }
  .x-row { display: flex; align-items: center; gap: var(--hao-space-5); flex-wrap: wrap; }
  .x-cover { padding: var(--hao-space-12) var(--hao-space-6); gap: var(--hao-space-4); }
  .x-cover h1, .x-cover p { margin: 0; }
  .x-cover p { color: var(--hao-ink-secondary); max-width: 30em; }
  .x-cover h1 { text-wrap: balance; }
</style>
</head>

<template id="article-zh">
<div class="x x--paper">
  <article class="hao-prose" style="padding-top:var(--hao-space-8)">
    <h1>雾里的早晨</h1>
    <p class="hao-prose__meta">丙午年 小雪前四日</p>
    <p>早上推开窗，对面的楼只剩一个淡淡的轮廓。雾把远处的东西都收走了，只留下眼前这一小块：窗台、一盆文竹、一杯刚倒的水。</p>
    <h2>近处</h2>
    <p>平时总觉得要看得远才算看清楚。今天看不远，反倒把近处的东西看了个仔细。</p>
    <h3 class="x-h3">窗台上的三样东西</h3>
    <p>文竹的叶子细得像一层烟，杯口的水汽和窗外的雾接在一起，分不出哪一边是屋里。</p>
    <blockquote class="hao-quote"><p>虽由人作，宛自天开。</p><cite>计成《园冶》</cite></blockquote>
    <p>画山水的人说，纸上最要紧的是没画的地方。雾大概就是天地自己留的白。</p>
    <div class="hao-prose__sign"><span class="hao-sign"><span class="hao-slip">丙午冬</span><span class="hao-seal hao-seal--sm hao-seal--outline" aria-hidden="true">印</span></span></div>
  </article>
</div>
</template>

<template id="article-en">
<div class="x x--paper">
  <article class="hao-prose" style="padding-top:var(--hao-space-8)">
    <h1>A foggy morning</h1>
    <p class="hao-prose__meta">Four days before Minor Snow (<span lang="zh">小雪</span>), the Bingwu year</p>
    <p>I opened the window this morning and the building across the way was only a faint outline. The fog had taken everything far off, leaving just this small patch in front of me.</p>
    <h2>What is near</h2>
    <p>Most days I feel that seeing far is what it means to see clearly. Today I couldn’t see far, and so I looked closely at what was near.</p>
    <h3 class="x-h3">Three things on the windowsill</h3>
    <p>The fern’s leaves are fine as smoke, and the steam from the glass joins the fog outside until I can’t tell which side is indoors.</p>
    <blockquote class="hao-quote"><p>Though made by human hands, it seems to come from heaven.</p><cite>Ji Cheng, The Craft of Gardens</cite></blockquote>
    <p>Landscape painters say the most important part of the paper is the place left unpainted. Fog is probably the blank the world leaves for itself.</p>
    <div class="hao-prose__sign"><span class="hao-sign"><span class="hao-colophon">Winter, the Bingwu year</span><span class="hao-seal hao-seal--sm hao-seal--outline" lang="zh" aria-hidden="true">印</span></span></div>
  </article>
</div>
</template>

<script>
(function () {
  var q = window.__q;
  var t = document.getElementById(q.sample + '-' + q.lang);
  document.body.appendChild(t.content.cloneNode(true));
  /* 「现在」没有第三级标题：今天只能拿 headline 顶上，照实摆出来 */
  if (q.scale === 'now') {
    document.querySelectorAll('.x-h3').forEach(function (h) { h.classList.add('hao-headline'); h.style.margin = 'var(--hao-space-6) 0 var(--hao-space-2)'; });
  }
  function tell() { parent.postMessage({ typeScaleFrame: location.search, height: Math.ceil(document.body.getBoundingClientRect().height) + 1 }, '*'); }
  window.addEventListener('load', tell);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(tell);
  window.addEventListener('resize', tell);
  if (window.ResizeObserver) new ResizeObserver(tell).observe(document.body);
})();
</script>
